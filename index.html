<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Ninja Game</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="theme-selector">
            <button onclick="setTheme('ninja')">🔴</button>
            <button onclick="setTheme('wall')">🟢</button>
            <button onclick="setTheme('yin-yang')">⚫</button>
            <button onclick="setTheme('watermelon')">🟣</button>
            <button onclick="setTheme('blue')">🔵</button>
            <button onclick="setTheme('white')">⚪</button>
        </div>
        <div id="game">
            <div id="score">Score: 0</div>
            <div id="timer">Time: 30</div>
            <div id="message">Ninja Master!</div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
